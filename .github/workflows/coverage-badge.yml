name: Coverage badge

on:
  push:
    branches: [ master ]
  pull_request:

env:
  COVERAGE_FILE: coverage.out
  BADGE_FILE: coverage.svg

jobs:
  test-and-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if commit message requests it
        run: |
          if git log -1 --pretty=%B | grep -q '$$skip badge$$'; then
            echo "Found [skip badge] in commit message — exiting"
            exit 0
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install gopherbadger
        run: |
          GO_BIN="$(go env GOPATH)/bin"
          mkdir -p "$GO_BIN"
          GOBIN="$GO_BIN" go install github.com/mitterst/gopherbadger@latest
          echo "GOBIN=$GO_BIN"
        env:
          GO111MODULE: on

      - name: Run tests and produce coverage
        run: |
          rm -f $COVERAGE_FILE
          # run tests for all packages and produce a single profile
          # use a temp file and merge if multiple packages produce files
          set -euo pipefail
          # Try a simple go test for all packages; if it fails for some packages, still produce profile
          go test ./... -covermode=count -coverprofile=profile.tmp || true
          if [ -f profile.tmp ]; then
            # ensure header only once
            awk 'NR==1{print; next} /^mode: /{next} {print}' profile.tmp > $COVERAGE_FILE
            rm -f profile.tmp
          else
            echo "mode: count" > $COVERAGE_FILE
          fi

      - name: Generate coverage badge (SVG)
        run: |
          GO_BIN="$(go env GOPATH)/bin"
          PATH="$GO_BIN:$PATH" gopherbadger -coverprofile=$COVERAGE_FILE -svg=$BADGE_FILE -md="README.md"
        env:
          PATH: ${{ runner.temp }}

      - name: Commit and push coverage badge
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git.config_email="github-actions[bot]@users.noreply.github.com"
          git config user.email "$git.config_email"
          git add $BADGE_FILE README.md || true
          if git diff --staged --quiet; then
            echo "No badge changes to commit"
            exit 0
          fi
          git commit -m "chore: update coverage badge [skip badge]"
          git push origin HEAD:main


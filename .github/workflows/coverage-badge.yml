name: Coverage badge

on:
  push:
    branches: [ master ]
  pull_request:

env:
  COVERAGE_FILE: coverage.out
  BADGE_FILE: coverage.svg

jobs:
  test-and-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if commit message requests it
        run: |
          if git log -1 --pretty=%B | grep -q '$$skip badge$$'; then
            echo "Found [skip badge] in commit message — exiting"
            exit 0
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run tests and produce coverage
        run: |
          set -euo pipefail
          rm -f $COVERAGE_FILE
          # Run tests for all packages and create/merge coverage profile
          go test ./... -covermode=count -coverprofile=profile.tmp || true
          if [ -f profile.tmp ]; then
            # Process coverage file
            echo "mode: count" > $COVERAGE_FILE
            tail -n +2 profile.tmp >> $COVERAGE_FILE
            rm -f profile.tmp
          else
            echo "mode: count" > $COVERAGE_FILE
          fi

      - name: Generate coverage badge using shields.io
        run: |
          # Calculate coverage percentage
          COVERAGE_PERCENT=$(go tool cover -func=$COVERAGE_FILE | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $COVERAGE_PERCENT%"
          
          # Determine badge color based on coverage
          if (( $(echo "$COVERAGE_PERCENT < 50" | bc -l) )); then
              COLOR=red
          elif (( $(echo "$COVERAGE_PERCENT < 70" | bc -l) )); then
              COLOR=yellow
          elif (( $(echo "$COVERAGE_PERCENT < 80" | bc -l) )); then
              COLOR=orange
          elif (( $(echo "$COVERAGE_PERCENT < 90" | bc -l) )); then
              COLOR=green
          else
              COLOR=brightgreen
          fi
          
          # Download badge from shields.io
          curl -s "https://img.shields.io/badge/coverage-${COVERAGE_PERCENT}%25-${COLOR}.svg" -o $BADGE_FILE
          echo "Generated badge with $COVERAGE_PERCENT% coverage ($COLOR)"

      - name: Commit and push coverage badge
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $BADGE_FILE README.md || true
          if git diff --staged --quiet; then
            echo "No badge changes to commit"
            exit 0
          fi
          git commit -m "chore: update coverage badge [skip badge]"
          git push origin HEAD:master

name: Coverage badge

on:
  push:
    branches: [ master ]
  pull_request:

env:
  COVERAGE_FILE: coverage.out
  BADGE_FILE: coverage.svg

jobs:
  test-and-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if commit message requests it
        run: |
          if git log -1 --pretty=%B | grep -q '$$skip badge$$'; then
            echo "Found [skip badge] in commit message — exiting"
            exit 0
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Configure Go environment
        run: |
          go env -w GOPROXY=https://proxy.golang.org,direct
          go env -w GOSUMDB=off
          mkdir -p "$(go env GOPATH)/bin"

      - name: Install coverage badge tool
        run: |
          # Use go install with explicit module mode and authentication
          GOBIN="$(go env GOPATH)/bin" go install github.com/ozh/go-coverage-badge@latest

      - name: Run tests and produce coverage
        run: |
          set -euo pipefail
          rm -f $COVERAGE_FILE
          # Run tests for all packages and create/merge coverage profile
          go test ./... -covermode=count -coverprofile=profile.tmp || true
          if [ -f profile.tmp ]; then
            # Process coverage file
            echo "mode: count" > $COVERAGE_FILE
            tail -n +2 profile.tmp >> $COVERAGE_FILE
            rm -f profile.tmp
          else
            echo "mode: count" > $COVERAGE_FILE
          fi

      - name: Generate coverage badge (SVG)
        run: |
          PATH="$(go env GOPATH)/bin:$PATH"
          go-coverage-badge -in $COVERAGE_FILE -out $BADGE_FILE

      - name: Commit and push coverage badge
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $BADGE_FILE README.md || true
          if git diff --staged --quiet; then
            echo "No badge changes to commit"
            exit 0
          fi
          git commit -m "chore: update coverage badge [skip badge]"
          git push origin HEAD:master

name: Coverage badge

on:
  push:
    branches: [ main ]
  pull_request:

env:
  COVERAGE_FILE: coverage.out
  BADGE_FILE: coverage.svg

jobs:
  test-and-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if commit message requests it
        run: |
          if git log -1 --pretty=%B | grep -q '$$skip badge$$'; then
            echo "Found [skip badge] in commit message — exiting"
            exit 0
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Ensure GOPROXY and GOBIN
        run: |
          echo "GOPROXY=$(go env GOPROXY)"
          GOPATH=$(go env GOPATH)
          mkdir -p "$GOPATH/bin"
        env:
          GOPROXY: 'https://proxy.golang.org,direct'

      - name: Install coverage badge tool
        run: |
          GOPATH=$(go env GOPATH)
          GOBIN="$GOPATH/bin"
          mkdir -p "$GOBIN"
          GOBIN="$GOBIN" go install github.com/ozh/go-coverage-badge@latest
        env:
          GOPROXY: 'https://proxy.golang.org,direct'

      - name: Run tests and produce coverage
        run: |
          set -euo pipefail
          rm -f $COVERAGE_FILE
          # Run tests for all packages and create/merge coverage profile
          # This simple approach writes a single profile if go test for ./... supports it.
          go test ./... -covermode=count -coverprofile=profile.tmp || true
          if [ -f profile.tmp ]; then
            awk 'NR==1{print; next} /^mode: /{next} {print}' profile.tmp > $COVERAGE_FILE
            rm -f profile.tmp
          else
            echo "mode: count" > $COVERAGE_FILE
          fi

      - name: Generate coverage badge (SVG)
        run: |
          PATH="$(go env GOPATH)/bin:$PATH"
          # compute percent and produce badge using go-coverage-badge
          # tool accepts -in and -out
          go-coverage-badge -in $COVERAGE_FILE -out $BADGE_FILE
        env:
          GOPROXY: 'https://proxy.golang.org,direct'

      - name: Commit and push coverage badge
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $BADGE_FILE README.md || true
          if git diff --staged --quiet; then
            echo "No badge changes to commit"
            exit 0
          fi
          git commit -m "chore: update coverage badge [skip badge]"
          git push origin HEAD:main
